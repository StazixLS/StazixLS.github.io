<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sev FORNER | Portfolio</title>
  <meta name="robots" content="noindex">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #191724; color: #e0def4; font: 16px/1.6 system-ui, sans-serif; }
    a { color: #eb6f92; }
  </style>
</head>
<body>
  <p>Redirection vers <a id="go" href="/Portfolio/">stazixls.github.io/Portfolio</a>...</p>
  <script>
    /* GitHub Pages distingue majuscules et minuscules : le site vit à /Portfolio/,
       donc /portfolio/... et les anciennes adresses sans préfixe arrivent ici.
       On les renvoie vers la bonne adresse, en gardant le reste du chemin. */
    (function () {
      var SITE = '/Portfolio';
      var path = location.pathname;
      if (path === SITE || path.indexOf(SITE + '/') === 0) return; // déjà bonne adresse : pas de boucle
      var m = path.match(/^\/portfolio(\/.*)?$/i);
      var rest = m ? (m[1] || '/') : path;
      var target = SITE + rest + location.search + location.hash;
      document.getElementById('go').href = target;
      location.replace(target);
    })();
  </script>
</body>
</html>
